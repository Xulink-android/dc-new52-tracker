name: Audit CBH to CBRO Marvel issue IDs
on:
  push:
    paths:
      - '.github/workflows/audit-herald-progress.yml'
      - 'scripts/audit_marvel_progress_crosswalk.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/audit_marvel_progress_crosswalk.py
